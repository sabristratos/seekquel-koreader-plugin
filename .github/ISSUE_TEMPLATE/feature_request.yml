name: Feature request
description: Something you want the plugin to do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: Describe the reading you are trying to get into Seekquel, not the code change.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: What you do today instead
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything else
